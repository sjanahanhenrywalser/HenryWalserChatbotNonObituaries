name: Daily Page Sync

on:
  schedule:
    # Runs automatically every day at 03:00 UTC (offset from the obituary job's 02:00)
    - cron: '0 3 * * *'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions UI

permissions:
  contents: write   # lets github-actions[bot] push the updated tracker file

jobs:
  scrape-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run Page Scraper
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
          python scrape_pages.py --sheet-name "HenryWalserChatbotInfo" --worksheet "OtherPages" --force

      - name: Save updated processed_pages.json back to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add processed_pages.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update processed_pages.json [skip ci]" && git push)
      - name: Record last run time on the spreadsheet
        if: always()                 # also records failures, when you most want to know
        continue-on-error: true      # a timestamp problem never fails the sync itself
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > service_account.json
          python write_status.py --sheet-name "HenryWalserChatbotInfo" --job "Website pages" --data-tab "OtherPages" --result "${{ job.status }}"